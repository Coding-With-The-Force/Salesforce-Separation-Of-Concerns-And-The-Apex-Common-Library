name: Deploy to GitHub Pages

# The permissions, concurrency and two-job upload/deploy shape are unchanged
# from the MkDocs workflow — only the build step is different.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # ci, not install — the lockfile is the source of truth, so a build
      # is reproducible and a transitive bump can't change the output
      # without a commit.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # onBrokenLinks is 'throw', so a dead cross-link fails here rather
      # than shipping.
      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
